name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Check lockfile
        run: uv lock --check

      - name: Ruff lint check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .
